server:
  host: "127.0.0.1"
  port: 8080

scanner:
  default_root: "."
  max_file_size_mb: 10
  timeout_seconds: 60
  max_concurrent_workers: 4
  ignored_directories:
    - ".git"
    - "node_modules"
    - "dist"
    - "build"
    - ".next"
    - "vendor"
    - "__pycache__"
    - "data"
    - "brain"
    - ".gemini"
    - "scratch"
    - "tmp"
    - "bin"

policy_sync:
  authoritative_contract_path: "policies/rules/edgeCases/algos/agent-operating-contract.md"
  submodule_path: "policies"
