openapi: 3.1.0
info:
  title: Policy Orchestrator & Algorithm Execution API
  version: 1.0.0
  description: >-
    Enterprise-grade, vendor-agnostic REST API for repository invariant auditing,
    grounded hybrid GraphRAG, autonomous AI Agent orchestration, and direct execution
    of all 197 Layer 1 algorithms across Search, Observability, Update, Vector, Graph, Filter, and Transform categories.
    Strictly conforms to the RFC API Request & Response Structure Specification (v5.0).
servers:
  - url: http://localhost:8000
    description: Local development orchestrator

paths:
  /api/v1/health:
    get:
      summary: Service Health & Liveness Probe
      operationId: getHealth
      responses:
        '200':
          description: Health check envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_HealthResponse'

  /api/v1/audit/scan:
    post:
      summary: Execute Multi-Vector Invariant Repository Scan
      operationId: executeAuditScan
      parameters:
        - name: target_directory
          in: query
          required: false
          schema:
            type: string
            default: "."
      responses:
        '200':
          description: Audit scan findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AuditResponse'

  /api/v1/rag/index:
    post:
      summary: Re-index Grounded Markdown Policy Contracts
      operationId: indexPolicies
      responses:
        '200':
          description: Indexing completion status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_IndexingResponse'

  /api/v1/rag/search:
    post:
      summary: Grounded Hybrid Semantic & Lexical Policy Retrieval (RRF)
      operationId: searchPolicies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RAGSearchRequest'
      responses:
        '200':
          description: Grounded policy chunks with Reciprocal Rank Fusion scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_RAGSearchResponse'

  /api/v1/agent/run:
    post:
      summary: Run Autonomous AI Meta-Agent Reasoning Loop
      operationId: runMetaAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunRequest'
      responses:
        '200':
          description: Complete execution trajectory and final policy response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AgentRunResponse'

  /api/v1/agents:
    get:
      summary: List All 1000+ Declarative Specialized Policy Agents
      operationId: listDeclarativeAgents
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of registered specialized agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AgentListResponse'

  /api/v1/agents/{agent_id}/run:
    post:
      summary: Execute Specific Declarative Specialized Agent
      operationId: runSpecializedAgent
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunRequest'
      responses:
        '200':
          description: Agent execution trajectory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AgentRunResponse'

  /api/v1/algos/contracts:
    get:
      summary: List and Filter All 33 Layer 1 Algorithm Contracts
      operationId: listAlgorithmContracts
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [search, observability, update, vector, graph, reasoning]
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: purity
          in: query
          required: false
          schema:
            type: string
            enum: [PURE, IMPURE]
        - name: side_effects
          in: query
          required: false
          schema:
            type: string
            enum: [READ_ONLY, IN_MEMORY, DISK_WRITE, NETWORK_IO]
      responses:
        '200':
          description: List of registered Layer 1 Algorithm Contracts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgorithmContractListResponse'

  /api/v1/algos/contracts/{algo_id}:
    get:
      summary: Get Specific Layer 1 Algorithm Contract by ID
      operationId: getAlgorithmContract
      parameters:
        - name: algo_id
          in: path
          required: true
          schema:
            type: string
            example: "ALGO-VEC-01"
      responses:
        '200':
          description: Full Layer 1 Algorithm Contract specification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgorithmContractResponse'

  /api/v1/algos/adapters:
    get:
      summary: List All G4 Type Conversion Adapters
      operationId: listTypeAdapters
      responses:
        '200':
          description: List of registered type conversion adapters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_TypeAdapterListResponse'

  /api/v1/algos/compose:
    post:
      summary: Validate and Compose Dynamic Multi-Algorithm Pipeline
      operationId: composeAlgorithmPipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlgoComposeRequest'
      responses:
        '200':
          description: Validated execution pipeline DAG and inferred G4 adapters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoComposeResponse'

  /api/v1/algos/execute/{algo_id}:
    post:
      summary: Execute Any Layer 1 Algorithm Directly by ID
      operationId: executeAlgorithmDirect
      parameters:
        - name: algo_id
          in: path
          required: true
          schema:
            type: string
            example: "ALGO-VEC-01"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlgoExecuteRequest'
      responses:
        '200':
          description: Algorithm execution outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoExecuteResponse'

  /api/v1/algos/search/scan:
    post:
      summary: Multi-Pattern Fast Directory Scan (Search Algorithm Engine)
      operationId: scanDirectoryMultipattern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patterns]
              properties:
                root_dir:
                  type: string
                  default: "."
                patterns:
                  type: array
                  items:
                    type: string
                max_files:
                  type: integer
                  default: 1000
      responses:
        '200':
          description: Search algorithm match results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/observability/outline:
    post:
      summary: Hierarchical Symbol Outline Generation (Observability Algorithm Engine)
      operationId: generateFileOutline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_path]
              properties:
                file_path:
                  type: string
      responses:
        '200':
          description: Code symbols hierarchy and markdown outline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/observability/dependencies:
    post:
      summary: Module Import Graph & Cycle Detection (Observability Algorithm Engine)
      operationId: analyzeDependencies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                directory:
                  type: string
                  default: "."
      responses:
        '200':
          description: Import DAG report and cycle detection findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/observability/lint-comments:
    post:
      summary: Zero-Inline-Comment Doctrine Linter (Observability Algorithm Engine)
      operationId: lintComments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_path]
              properties:
                file_path:
                  type: string
      responses:
        '200':
          description: Zero-inline comment doctrine compliance report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/update/patch:
    post:
      summary: Deterministic Atomic Multi-File Patching (Update Algorithm Engine)
      operationId: applyBatchPatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  items:
                    type: object
                    required: [file_path, find_pattern, replace_text]
                    properties:
                      file_path: { type: string }
                      find_pattern: { type: string }
                      replace_text: { type: string }
                      expected_sha256: { type: string }
                      is_regex: { type: boolean, default: false }
                dry_run:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Batch patch execution and SHA-256 transitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/update/diff:
    post:
      summary: Unified GNU/Git Context Diff Engine (Update Algorithm Engine)
      operationId: generateDiff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [original_content, modified_content]
              properties:
                original_content: { type: string }
                modified_content: { type: string }
                file_path: { type: string, default: "file" }
      responses:
        '200':
          description: Unified diff text and added/deleted counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/vector/normalize:
    post:
      summary: L2 Vector Unit Normalization (ALGO-VEC-01)
      operationId: normalizeVector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vector]
              properties:
                vector:
                  type: array
                  items: { type: number }
                eps:
                  type: number
                  default: 1e-12
      responses:
        '200':
          description: L2 normalized unit vector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/vector/center:
    post:
      summary: Corpus Mean Centering & Anisotropy Removal (ALGO-VEC-02)
      operationId: centerVectors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vectors]
              properties:
                vectors:
                  type: array
                  items:
                    type: array
                    items: { type: number }
      responses:
        '200':
          description: Centered batch vectors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/vector/layer-norm:
    post:
      summary: Layer Normalization & Dimension Standardization (ALGO-VEC-03)
      operationId: layerNormVector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vector]
              properties:
                vector:
                  type: array
                  items: { type: number }
                gamma:
                  type: array
                  items: { type: number }
                beta:
                  type: array
                  items: { type: number }
                eps:
                  type: number
                  default: 1e-5
      responses:
        '200':
          description: Layer normalized vector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/vector/scale:
    post:
      summary: Min-Max and Z-Score Vector Scaling (ALGO-VEC-04)
      operationId: scaleVector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vector]
              properties:
                vector:
                  type: array
                  items: { type: number }
                min_val:
                  type: number
                  default: 0.0
                max_val:
                  type: number
                  default: 1.0
                method:
                  type: string
                  enum: [minmax, zscore]
                  default: minmax
      responses:
        '200':
          description: Scaled feature vector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/vector/slice:
    post:
      summary: Matryoshka Representation Learning Slicing (ALGO-VEC-05)
      operationId: sliceVector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vector]
              properties:
                vector:
                  type: array
                  items: { type: number }
                target_dim:
                  type: integer
                  default: 64
                renormalize:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Sliced and renormalized lower-dimensional vector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/vector/quantize/scalar:
    post:
      summary: Uniform Scalar Quantization SQ8/SQ4 (ALGO-VEC-06)
      operationId: quantizeScalar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vector]
              properties:
                vector:
                  type: array
                  items: { type: number }
                bits:
                  type: integer
                  enum: [4, 8]
                  default: 8
      responses:
        '200':
          description: Quantized integer values and scaling metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/vector/quantize/binary:
    post:
      summary: 1-Bit Binary Quantization (ALGO-VEC-07)
      operationId: quantizeBinary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vector]
              properties:
                vector:
                  type: array
                  items: { type: number }
      responses:
        '200':
          description: 1-bit binary representation and packed byte hex
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/vector/pool:
    post:
      summary: Sequence Token Pooling Engine (ALGO-VEC-08)
      operationId: poolTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token_embeddings]
              properties:
                token_embeddings:
                  type: array
                  items:
                    type: array
                    items: { type: number }
                attention_mask:
                  type: array
                  items: { type: integer }
                pooling_strategy:
                  type: string
                  enum: [mean, cls, last]
                  default: mean
      responses:
        '200':
          description: Pooled sequence representation vector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/vector/chunk:
    post:
      summary: Text Chunking and Semantic Breakpoints (ALGO-VEC-09)
      operationId: chunkText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                max_chunk_size:
                  type: integer
                  default: 200
                overlap:
                  type: integer
                  default: 40
      responses:
        '200':
          description: Segmented text chunks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/graph/bfs:
    post:
      summary: Breadth-First Search Traversal (ALGO-GRAPH-01)
      operationId: graphBfs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adjacency_list, start_node]
              properties:
                adjacency_list:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: string }
                start_node: { type: string }
                max_depth: { type: integer, default: -1 }
      responses:
        '200':
          description: Visited order and distances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/graph/dfs:
    post:
      summary: Depth-First Search Traversal (ALGO-GRAPH-02)
      operationId: graphDfs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adjacency_list, start_node]
              properties:
                adjacency_list:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: string }
                start_node: { type: string }
                max_depth: { type: integer, default: -1 }
      responses:
        '200':
          description: Visited order and cycle detection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/graph/dijkstra:
    post:
      summary: Dijkstra Shortest Path (ALGO-GRAPH-03)
      operationId: graphDijkstra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weighted_edges, start_node]
              properties:
                weighted_edges:
                  type: array
                  items:
                    type: object
                    required: [source, target, weight]
                    properties:
                      source: { type: string }
                      target: { type: string }
                      weight: { type: number }
                start_node: { type: string }
                target_node: { type: string }
      responses:
        '200':
          description: Shortest path distances and reconstructed paths
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/graph/astar:
    post:
      summary: A* Heuristic Search (ALGO-GRAPH-04 / ALGO-KG-67)
      operationId: graphAstar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weighted_edges, start_node, target_node]
              properties:
                weighted_edges:
                  type: array
                  items:
                    type: object
                    required: [source, target, weight]
                    properties:
                      source: { type: string }
                      target: { type: string }
                      weight: { type: number }
                start_node: { type: string }
                target_node: { type: string }
                heuristics:
                  type: object
                  additionalProperties: { type: number }
      responses:
        '200':
          description: Optimal path and search cost
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/graph/astar-query-plan:
    post:
      summary: A* Database Pushdown Query Plan Generator
      operationId: graphAstarQueryPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, target_id]
              properties:
                mode:
                  type: string
                  enum: [projected, procedure]
                  default: projected
                  description: Query mode ('projected' for GDS catalog or 'procedure' for APOC)
                source_id: { type: string, description: Unique start node identifier }
                target_id: { type: string, description: Unique destination target node identifier }
                graph_name: { type: string, default: default_graph, description: Graph catalog name }
                rel_type: { type: string, default: CONNECTED_TO, description: Relationship type }
                weight_prop: { type: string, default: cost, description: Relationship weight property }
                latitude_prop: { type: string, default: latitude, description: Latitude property }
                longitude_prop: { type: string, default: longitude, description: Longitude property }
      responses:
        '200':
          description: Parameterized Cypher/GQL query plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/graph/bfs-query-plan:
    post:
      summary: BFS Traversal Query Plan Generator
      operationId: graphBfsQueryPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_node]
              properties:
                start_node: { type: string, description: Root traversal node }
                max_depth: { type: integer, default: 3, description: Maximum depth limit }
      responses:
        '200':
          description: Parameterized Cypher traversal query plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/graph/dfs-query-plan:
    post:
      summary: DFS Traversal Query Plan Generator
      operationId: graphDfsQueryPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_node]
              properties:
                start_node: { type: string, description: Root traversal node }
                max_depth: { type: integer, default: 3, description: Maximum depth limit }
      responses:
        '200':
          description: Parameterized Cypher traversal query plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/graph/bidirectional-bfs-query-plan:
    post:
      summary: Bidirectional BFS Query Plan Generator
      operationId: graphBidirectionalBfsQueryPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, target_id]
              properties:
                source_id: { type: string, description: Source origin node }
                target_id: { type: string, description: Destination target node }
      responses:
        '200':
          description: Parameterized Cypher shortest path query plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/graph/dijkstra-query-plan:
    post:
      summary: Dijkstra Shortest Path Query Plan Generator
      operationId: graphDijkstraQueryPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph_name, source_id]
              properties:
                graph_name: { type: string, default: default_graph, description: GDS graph catalog name }
                source_id: { type: string, description: Source origin node }
                target_id: { type: string, description: Destination target node }
      responses:
        '200':
          description: Parameterized GDS Dijkstra query plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/graph/yens-query-plan:
    post:
      summary: Yen's K-Shortest Paths Query Plan Generator
      operationId: graphYensQueryPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph_name, source_id, target_id]
              properties:
                graph_name: { type: string, default: default_graph, description: GDS graph catalog name }
                source_id: { type: string, description: Source origin node }
                target_id: { type: string, description: Destination target node }
                k: { type: integer, default: 3, description: Number of paths }
      responses:
        '200':
          description: Parameterized GDS Yen's query plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/graph/pagerank-query-plan:
    post:
      summary: PageRank Centrality Query Plan Generator
      operationId: graphPageRankQueryPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph_name]
              properties:
                graph_name: { type: string, default: default_graph, description: GDS graph catalog name }
                damping_factor: { type: number, default: 0.85 }
                max_iterations: { type: integer, default: 20 }
                tolerance: { type: number, default: 1e-7 }
      responses:
        '200':
          description: Parameterized GDS PageRank query plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/graph/personalized-pagerank-query-plan:
    post:
      summary: Personalized PageRank Query Plan Generator
      operationId: graphPersonalizedPageRankQueryPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph_name, seed_node]
              properties:
                graph_name: { type: string, default: default_graph, description: GDS graph catalog name }
                seed_node: { type: string, description: Origin seed node }
                damping_factor: { type: number, default: 0.85 }
                max_iterations: { type: integer, default: 20 }
      responses:
        '200':
          description: Parameterized GDS Personalized PageRank query plan
          content:
