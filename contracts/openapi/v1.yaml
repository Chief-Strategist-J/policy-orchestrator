openapi: 3.1.0
info:
  title: Policy Orchestrator & AI Meta-Agent API
  version: 1.0.0
  description: >-
    Enterprise-grade, vendor-agnostic REST API for repository invariant auditing,
    grounded hybrid GraphRAG, autonomous AI Agent orchestration, and safe AST refactoring.
servers:
  - url: http://localhost:8000
    description: Local development orchestrator

paths:
  /api/v1/health:
    get:
      summary: Service Health & Liveness Probe
      operationId: getHealth
      responses:
        '200':
          description: Health check envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_HealthResponse'

  /api/v1/audit/scan:
    post:
      summary: Execute Multi-Vector Invariant Repository Scan
      operationId: executeAuditScan
      parameters:
        - name: target_directory
          in: query
          required: false
          schema:
            type: string
            default: "."
      responses:
        '200':
          description: Audit scan findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AuditResponse'

  /api/v1/rag/index:
    post:
      summary: Re-index Grounded Markdown Policy Contracts
      operationId: indexPolicies
      responses:
        '200':
          description: Indexing completion status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_IndexingResponse'

  /api/v1/rag/search:
    post:
      summary: Grounded Hybrid Semantic & Lexical Policy Retrieval (RRF)
      operationId: searchPolicies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RAGSearchRequest'
      responses:
        '200':
          description: Grounded policy chunks with Reciprocal Rank Fusion scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_RAGSearchResponse'

  /api/v1/agent/run:
    post:
      summary: Run Autonomous AI Meta-Agent Reasoning Loop
      operationId: runMetaAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunRequest'
      responses:
        '200':
          description: Complete execution trajectory and final policy response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AgentRunResponse'

  /api/v1/agents:
    get:
      summary: List All 1000+ Declarative Specialized Policy Agents
      operationId: listDeclarativeAgents
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of registered specialized agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AgentListResponse'

  /api/v1/agents/{agent_id}/run:
    post:
      summary: Execute Specific Declarative Specialized Agent
      operationId: runSpecializedAgent
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunRequest'
      responses:
        '200':
          description: Agent execution trajectory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AgentRunResponse'

  /api/v1/algos/search/scan:
    post:
      summary: Multi-Pattern Fast Directory Scan (Search Algorithm Engine)
      operationId: scanDirectoryMultipattern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patterns]
              properties:
                root_dir:
                  type: string
                  default: "."
                patterns:
                  type: array
                  items:
                    type: string
                max_files:
                  type: integer
                  default: 1000
      responses:
        '200':
          description: Search algorithm match results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/observability/outline:
    post:
      summary: Hierarchical Symbol Outline Generation (Observability Algorithm Engine)
      operationId: generateFileOutline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_path]
              properties:
                file_path:
                  type: string
      responses:
        '200':
          description: Code symbols hierarchy and markdown outline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/observability/dependencies:
    post:
      summary: Module Import Graph & Cycle Detection (Observability Algorithm Engine)
      operationId: analyzeDependencies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                directory:
                  type: string
                  default: "."
      responses:
        '200':
          description: Import DAG report and cycle detection findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/observability/lint-comments:
    post:
      summary: Zero-Inline-Comment Doctrine Linter (Observability Algorithm Engine)
      operationId: lintComments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_path]
              properties:
                file_path:
                  type: string
      responses:
        '200':
          description: Zero-inline comment doctrine compliance report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/update/patch:
    post:
      summary: Deterministic Atomic Multi-File Patching (Update Algorithm Engine)
      operationId: applyBatchPatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  items:
                    type: object
                    required: [file_path, find_pattern, replace_text]
                    properties:
                      file_path: { type: string }
                      find_pattern: { type: string }
                      replace_text: { type: string }
                      expected_sha256: { type: string }
                      is_regex: { type: boolean, default: false }
                dry_run:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Batch patch execution and SHA-256 transitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/algos/update/diff:
    post:
      summary: Unified GNU/Git Context Diff Engine (Update Algorithm Engine)
      operationId: generateDiff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [original_content, modified_content]
              properties:
                original_content: { type: string }
                modified_content: { type: string }
                file_path: { type: string, default: "file" }
      responses:
        '200':
          description: Unified diff text and added/deleted counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_AlgoResponse'

  /api/v1/graph/build:
    post:
      summary: Build Semantic Knowledge Graph from Markdown Contracts
      operationId: buildKnowledgeGraph
      responses:
        '200':
          description: Knowledge graph summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_GraphBuildResponse'

  /api/v1/graph/query:
    post:
      summary: Execute Declarative Cypher Query on Knowledge Graph
      operationId: queryKnowledgeGraph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQueryRequest'
      responses:
        '200':
          description: Cypher query result records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_GraphQueryResponse'

  /api/v1/graph/impact/{rule_id}:
    get:
      summary: Query Topological Invariant Dependencies and Failure Impact
      operationId: getRuleImpact
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Connected architecture patterns and failure modes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope_RuleImpactResponse'

components:
  schemas:
    ResponseMeta:
      type: object
      required:
        - trace_id
        - timestamp
        - version
        - status
      properties:
        trace_id:
          type: string
          example: "0af7651916cd43dd8448eb211c80319c"
        timestamp:
          type: string
          example: "2026-10-01T12:00:00Z"
        version:
          type: string
          example: "v1"
        status:
          type: string
          enum: [success, error]

    ErrorItem:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "VALIDATION_FAILED"
        message:
          type: string
          example: "Field 'prompt' is required."
        details:
          type: object

    RAGSearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          example: "transactional outbox dual write prevention"
        top_k:
          type: integer
          default: 5
        category_filter:
          type: string
        min_score:
          type: number
          default: 0.05

    AgentRunRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          example: "Audit codebase and check for naked sleeps and dual write traps"
        target_directory:
          type: string
          default: "."
        max_steps:
          type: integer
          default: 8
        temperature:
          type: number
          default: 0.2
        session_id:
          type: string

    GraphQueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          example: "MATCH (r:Rule)-[:ENFORCES]->(p:ArchitecturePattern) RETURN r, p"
        parameters:
          type: object

    Envelope_HealthResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          type: object
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'

    Envelope_AlgoResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          type: object
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'

    Envelope_AuditResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          type: object
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'

    Envelope_IndexingResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          type: object
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'

    Envelope_RAGSearchResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          type: object
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'

    Envelope_AgentRunResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          type: object
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'

    Envelope_AgentListResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          type: object
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'

    Envelope_GraphBuildResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          type: object
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'

    Envelope_GraphQueryResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          type: object
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'

    Envelope_RuleImpactResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          type: object
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
