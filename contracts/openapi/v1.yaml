openapi: 3.1.0
info:
  title: Policy & Invariant Orchestration API
  version: 1.0.0
  description: REST API for repository invariant auditing, policy synchronization, and batch refactor execution.
paths:
  /api/v1/audit:
    post:
      summary: Execute multi-vector repository invariant audit
      operationId: executeAudit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRequest'
      responses:
        '200':
          description: Audit completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResponse'
  /api/v1/refactor:
    post:
      summary: Execute dry-run or applied batch code refactoring
      operationId: executeRefactor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefactorRequest'
      responses:
        '200':
          description: Refactor operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefactorResponse'

components:
  schemas:
    AuditRequest:
      type: object
      required:
        - target_path
      properties:
        target_path:
          type: string
        categories:
          type: array
          items:
            type: string
        severity_threshold:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM, LOW]
    AuditResponse:
      type: object
      required:
        - total_findings
        - findings
      properties:
        total_findings:
          type: integer
        findings:
          type: array
          items:
            $ref: '#/components/schemas/AuditFinding'
    AuditFinding:
      type: object
      required:
        - rule_id
        - category
        - severity
        - file
        - line
        - snippet
        - recommendation
      properties:
        rule_id:
          type: string
        category:
          type: string
        severity:
          type: string
        file:
          type: string
        line:
          type: integer
        snippet:
          type: string
        recommendation:
          type: string
    RefactorRequest:
      type: object
      required:
        - target_path
        - find_pattern
        - replace_text
      properties:
        target_path:
          type: string
        find_pattern:
          type: string
        replace_text:
          type: string
        is_regex:
          type: boolean
        dry_run:
          type: boolean
    RefactorResponse:
      type: object
      required:
        - total_occurrences
        - modified_files
        - dry_run
      properties:
        total_occurrences:
          type: integer
        modified_files:
          type: integer
        dry_run:
          type: boolean
