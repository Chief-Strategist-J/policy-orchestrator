components:
  schemas:
    ResponseMeta:
      type: object
      required:
        - requestId
        - correlationId
        - timestamp
        - apiVersion
        - status
        - trace_id
      properties:
        requestId:
          type: string
          example: "req-1700000000000-a1b2c3"
        correlationId:
          type: string
          example: "corr-1700000000000-x9y8z7"
        causationId:
          type: string
          nullable: true
        timestamp:
          type: string
          example: "2026-10-05T14:00:00.000Z"
        executionTimeMs:
          type: integer
          example: 12
        apiVersion:
          type: string
          example: "v1"
        status:
          type: string
          enum: [success, error]
        trace_id:
          type: string
          example: "0af7651916cd43dd8448eb211c80319c"
        auditLogId:
          type: string
          nullable: true
        operationId:
          type: string
          nullable: true
        deprecatedFields:
          type: array
          items: { type: string }
          nullable: true
        supportedVersions:
          type: array
          items: { type: string }
        staleness:
          type: object
          nullable: true
        pagination:
          type: object
          nullable: true
        links:
          type: object
          nullable: true

    ErrorContainer:
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          example: "VALIDATION_FAILED"
        message:
          type: string
          example: "One or more payload validation checks failed."
        retryable:
          type: boolean
          default: false
        details:
          type: array
          items:
            type: object

    ErrorItem:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "VALIDATION_FAILED"
        message:
          type: string
          example: "One or more payload validation checks failed."
        details:
          type: object

    RAGSearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          example: "transactional outbox dual write prevention"
        top_k:
          type: integer
          default: 5
        category_filter:
          type: string
        min_score:
          type: number
          default: 0.05

    AgentRunRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          example: "Audit codebase and check for naked sleeps and dual write traps"
        target_directory:
          type: string
          default: "."
        max_steps:
          type: integer
          default: 8
        temperature:
          type: number
          default: 0.2
        session_id:
          type: string

    AlgoComposeRequest:
      type: object
      required: [algo_ids]
      properties:
        algo_ids:
          type: array
          items:
            type: string
          example: ["ALGO-SRCH-03", "ALGO-SRCH-11", "ALGO-OBS-16"]
        strict_check:
          type: boolean
          default: true

    AlgoExecuteRequest:
      type: object
      properties:
        inputs:
          type: object
          description: Input payload matching algorithm contract input_schema
        parameters:
          type: object
          description: Optional execution parameters

    Envelope_HealthResponse:
      type: object
      required: [success, statusCode, meta, data]
      properties:
        success: { type: boolean, example: true }
        statusCode: { type: integer, example: 200 }
        data: { type: object }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
        error: { $ref: '#/components/schemas/ErrorContainer' }
        errors: { type: array, items: { $ref: '#/components/schemas/ErrorItem' }, nullable: true }

    Envelope_AlgoResponse:
      type: object
      required: [success, statusCode, meta, data]
      properties:
        success: { type: boolean, example: true }
