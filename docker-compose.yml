version: "3.8"

services:
  policy-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: chief-strategist/policy-orchestrator:latest
    container_name: policy-orchestrator
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://alloy_admin:alloysecret@alloydb:5432/policy_orchestration
      - POLICY_RULES_DIR=/app/policies/rules
      - LLM_BACKEND=mock # Options: mock, openai, ollama
      - VECTOR_BACKEND=qdrant # Options: inmemory, qdrant
      - GRAPH_BACKEND=neo4j # Options: inmemory, neo4j
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=policy_rules
      - NEO4J_URI=http://neo4j:7474
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=policysecret
      - OPENAI_BASE_URL=https://api.openai.com/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-EMPTY}
      - OPENAI_MODEL=gpt-4o
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - OLLAMA_MODEL=llama3.2
    volumes:
      - ../rules:/app/policies/rules:ro
    depends_on:
      alloydb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  alloydb:
    image: google/alloydbomni:latest
    container_name: policy-alloydb
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=alloy_admin
      - POSTGRES_PASSWORD=alloysecret
      - POSTGRES_DB=policy_orchestration
    volumes:
      - alloydb_data:/var/lib/postgresql/data
    shm_size: '2gb'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alloy_admin -d policy_orchestration"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: policy-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.24-community
    container_name: policy-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/policysecret
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  alloydb_data:
  qdrant_data:
  neo4j_data:
