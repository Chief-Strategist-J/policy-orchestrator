domain: "conflict_engine"
description: "Policy & Distributed Conflict Resolution Engine, Invariant Contradiction Detection, Distributed Persistence, Replication Arbitration, and Storage Partitioning Subsystem"
version: "1.0.0"

responsibilities:
  - "Invariant & Policy Clash Detection: Analyzes AST, CST, and policy rule sets to detect semantic contradictions and overlaps"
  - "Priority & Deny-Override Arbitration: Resolves conflicting business decision trees using deterministic priority weights and deny-override semantics"
  - "Distributed Replication & Persistence Governance: Manages quorum consistency, active-active conflict arbitration, and WAL replication"
  - "CRDT & State Convergence: Merges divergent state vectors using Conflict-Free Replicated Data Types (PNCounter, LWWRegister, ORSet, RGAText)"
  - "Anti-Entropy & Merkle Tree Synchronization: Identifies distributed data divergence ranges via hierarchical Merkle tree hash comparisons"
  - "Fencing Epoch & Monotonic Version Guards: Prevents split-brain stale mutations using monotonic epoch fencing tokens"
  - "Partitioning & Storage Management: Governs range/hash/directory partitioning, LSM storage engines, and tiered storage migrations"
  - "Deadlock & Cycle Detection: Discovers circular waiting dependencies and rule precedence cycles using Wait-For-Graph (WFG) analysis"

patterns_and_algorithms:
  distributed_persistence_and_replication_patterns:
    - id: 1
      name: "Leader-Follower Replication"
      spec_location: "database/replication/topology_spec.yaml"
      adapter_location: "src/infra/adapters/database/replication/leader_follower.adapter"
      description: "Single-leader sequential log replication with configurable follower lag bounds and failover arbitration."
    - id: 2
      name: "Multi-Leader Replication"
      spec_location: "database/replication/topology_spec.yaml"
      adapter_location: "src/infra/adapters/database/replication/multi_leader.adapter"
      description: "Resolves concurrent multi-region writes via Last-Write-Wins (LWW), version vectors, and custom domain merge handlers."
    - id: 3
      name: "Leaderless Dynamo-Style Quorums"
      spec_location: "database/quorums/quorum_config.yaml"
      adapter_location: "src/infra/adapters/database/replication/leaderless_dynamo.adapter"
      description: "Enforces strict quorum invariant (W + R > N) with asynchronous read-repair for divergent replicas."
    - id: 4
      name: "Sync / Async / Semi-Sync ACKs"
      spec_location: "database/quorums/ack_policy.yaml"
      adapter_location: "src/infra/adapters/database/replication/ack_pipeline.adapter"
      description: "Configurable acknowledgment pipeline managing durability and latency tradeoffs across replica tiers."
    - id: 5
      name: "Chain Replication"
      spec_location: "database/replication/chain_replication.yaml"
      adapter_location: "src/infra/adapters/database/replication/chain_replication.adapter"
      description: "Strict serial write propagation along node chains guaranteeing linearizable reads at tail and writes at head."
    - id: 6
      name: "Raft State Machine Replication"
      spec_location: "database/consensus/raft_consensus.yaml"
      adapter_location: "src/infra/adapters/database/consensus/raft_consensus.adapter"
      description: "Maintains linearizable log replication and leader election across consensus clusters."
    - id: 7
      name: "Quorum Configuration Layer"
      spec_location: "database/quorums/quorum_config.yaml"
      adapter_location: "src/infra/adapters/database/quorums/quorum_validator.adapter"
      description: "Declarative quorum ratio validator and fallback fetcher for strict consistency."
    - id: 8
      name: "WAL Shipping"
      spec_location: "database/consensus/wal_shipping.yaml"
      adapter_location: "src/infra/adapters/database/wal/wal_shipper.adapter"
      description: "Physical Write-Ahead Log streaming from primary storage nodes to hot standbys."
    - id: 9
      name: "Change Data Capture (CDC)"
      spec_location: "database/cdc/cdc_publisher_spec.json"
      adapter_location: "src/infra/adapters/database/cdc/cdc_stream_pipeline.adapter"
      description: "Tails storage WAL to publish row-level mutation events to message brokers and search indices."
    - id: 10
      name: "Sharded Replication"
      spec_location: "database/sharding/shard_hash_ring.yaml"
      adapter_location: "src/infra/adapters/database/sharding/sharded_router.adapter"
      description: "Combines horizontal hash partitioning with per-shard replica groups and scatter-gather queries."
    - id: 11
      name: "Active-Active Replication"
      spec_location: "database/replication/topology_spec.yaml"
      adapter_location: "src/infra/adapters/database/replication/active_active.adapter"
      description: "Bidirectional active-active cross-region mutation synchronization with deterministic tie-breaking."
    - id: 12
      name: "Active-Passive (Failover) Replication"
      spec_location: "database/fencing/fencing_epoch_failover.sql"
      adapter_location: "src/infra/adapters/database/replication/active_passive.adapter"
      description: "Automatic primary failover with epoch fencing and DNS router updates upon heartbeat timeout."
    - id: 13
      name: "Gossip / Epidemic Propagation"
      spec_location: "database/replication/topology_spec.yaml"
      adapter_location: "src/infra/adapters/database/replication/gossip_protocol.adapter"
      description: "Decentralized state dissemination and heartbeat counters across cluster peers."
    - id: 14
      name: "CRDT-Based Replication"
      spec_location: "database/crdts/crdt_definitions.yaml"
      adapter_location: "src/infra/adapters/database/crdts/crdt_merger.adapter"
      description: "Mathematically guarantees eventual convergence of conflicting state updates without centralized locks (PNCounter, LWWRegister, ORSet, RGAText)."
    - id: 15
      name: "Anti-Entropy Repair (Merkle Trees)"
      spec_location: "database/anti_entropy/merkle_tree_sync.sql"
      adapter_location: "src/infra/adapters/database/anti_entropy/merkle_anti_entropy.adapter"
      description: "Efficiently locates divergent key ranges across replicas using sub-linear Merkle hash tree diffing."
    - id: 16
      name: "Fencing Epoch Token Control"
      spec_location: "database/fencing/fencing_epoch_failover.sql"
      adapter_location: "src/infra/adapters/database/fencing/fencing_token_guard.adapter"
      description: "Guards against split-brain zombie writes by enforcing monotonically increasing epoch tokens on every storage mutation."
    - id: 17
      name: "Hybrid Clock & Conflict Helpers"
      spec_location: "database/crdts/hybrid_clock.yaml"
      adapter_location: "src/infra/adapters/database/crdts/hybrid_clock_resolver.adapter"
      description: "Combines physical wall-clock timestamps with Lamport logical counters to establish deterministic causal (Happens-Before) order."

  data_partitioning_and_storage_patterns:
    - id: 1
      name: "Range-Based Partitioning"
      spec_location: "database/partitioning/range_partitioning.yaml"
      adapter_location: "src/infra/adapters/database/partitioning/range_partition_router.adapter"
      description: "Splits key spaces into ordered contiguous ranges for optimized range-query workloads."
    - id: 2
      name: "Hash-Based Partitioning"
      spec_location: "database/partitioning/hash_partitioning.yaml"
      adapter_location: "src/infra/adapters/database/partitioning/consistent_hash_ring.adapter"
      description: "Distributes records uniformly across storage partitions using consistent hashing and virtual nodes."
    - id: 3
      name: "Directory-Based Partitioning"
      spec_location: "database/partitioning/directory_partitioning.json"
      adapter_location: "src/infra/adapters/database/partitioning/directory_lookup_router.adapter"
      description: "Dynamic routing lookup service mapping partition keys to specific storage nodes."
    - id: 4
      name: "Read Replica Query Routing"
      spec_location: "database/replication/topology_spec.yaml"
      adapter_location: "src/infra/adapters/database/replication/read_replica_router.adapter"
      description: "Routes read-only queries to read replicas while enforcing read-your-writes causal consistency."
    - id: 5
      name: "Write Replica (Designated Writer)"
      spec_location: "database/replication/topology_spec.yaml"
      adapter_location: "src/infra/adapters/database/replication/designated_writer_guard.adapter"
      description: "Ensures all mutating operations are channeled exclusively to designated writer nodes."
    - id: 6
      name: "Multi-Master Replication"
      spec_location: "database/replication/topology_spec.yaml"
      adapter_location: "src/infra/adapters/database/replication/multi_master_reconciler.adapter"
      description: "Reconciles concurrent writes across multiple writable master database instances."
    - id: 7
      name: "Log-Structured Storage (LSM)"
      spec_location: "database/storage_engine/lsm_storage.yaml"
      adapter_location: "src/infra/adapters/database/storage/lsm_engine.adapter"
      description: "Appends mutations to in-memory MemTables before flushing to immutable SSTables with background compaction."
    - id: 8
      name: "Tiered Storage Management"
      spec_location: "database/storage_engine/tiered_storage.yaml"
      adapter_location: "src/infra/adapters/database/storage/tiered_storage_migrator.adapter"
      description: "Migrates data blocks between hot NVMe, warm SSD, and cold cloud object tiers based on access age."
    - id: 9
      name: "Cold/Hot Data Separation"
      spec_location: "database/storage_engine/hot_cold_archiving.sql"
      adapter_location: "src/infra/adapters/database/storage/hot_cold_archiver.adapter"
      description: "Separates frequently queried working sets from historical cold records into archived partitions."
    - id: 10
      name: "Polyglot Persistence Dispatch"
      spec_location: "database/storage_engine/polyglot_dispatch.json"
      adapter_location: "src/infra/adapters/database/storage/polyglot_workload_dispatcher.adapter"
      description: "Directs relational, document, graph, and time-series workloads to their optimal storage engines."

  core_engine_patterns:
    - name: "Deny-Override Priority Resolution Matrix"
      location: "src/features/conflict_engine/rules/conflict_engine_rules.py"
      description: "Evaluates multi-branch rule conditions as declarative data with priority weighting and absolute deny-override semantics."
    - name: "Declarative Anti-Corruption Layer (ACL)"
      location: "src/features/conflict_engine/schema/conflict_engine_schema.py"
      description: "Pure declarative transformation layer (rename, pick, omit, coerce, default) isolating domain entities from wire contracts."
    - name: "Resilience Decorator Composition"
      location: "src/infra/adapters/decorators.py"
      description: "Unified composition: withTracing(withCircuitBreaker(withCache(withRetry(adapter)))) wrapping all outbound ports."

dependencies:
  inbound:
    - "src/api/rest/v1/handlers/conflict_engine_handler.py"
    - "src/api/events/conflict_event_consumer.py"
  outbound:
    - "src/features/conflict_engine/repository/conflict_engine_repository_port.py"
    - "src/infra/adapters/database/crdts/crdt_merger.adapter"
    - "src/infra/adapters/database/anti_entropy/merkle_anti_entropy.adapter"
  cross_feature: "NONE - interacts via public interfaces, repository ports, and domain events only"

