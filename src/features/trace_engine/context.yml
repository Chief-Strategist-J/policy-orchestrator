domain: "trace_engine"
description: "Distributed Observability Engine, OpenTelemetry Trace Aggregation, Span Waterfall Synthesis, Latency Profiling, and Failure Diagnosis Subsystem"
version: "1.0.0"

responsibilities:
  - "Distributed Trace & Span Ingestion: Collects and indexes OpenTelemetry spans, W3C traceparents, and Baggage context across polyglot microservices"
  - "Waterfall Hierarchy Synthesis: Reconstructs end-to-end directed acyclic span trees and calculates critical path latency breakdowns"
  - "Failure Diagnosis & Anomaly Detection: Analyzes race conditions, deadlock wait-for graphs, heap diffs, GC pauses, and eBPF syscall logs"
  - "Distributed Diagnostic Clocks & Order Verification: Tracks Lamport logical clocks, Vector clocks, and Hybrid Logical Clocks (HLC) for causal ordering"
  - "Deterministic Event Replay & Chaos Diagnostics: Manages event-sourced timeline replay, boundary VCR network proxies, and chaos injection audits"
  - "Tail-Based Sampling Governance: Enforces 100% trace retention on errors, latency outliers, and anomalous circuit breaker trips"

patterns_and_algorithms:
  complex_failure_diagnosis_patterns:
    - id: 1
      name: "Happens-Before Race Detection"
      location: "src/infra/observability/race_detection/"
      engine: "src/infra/observability/race_detection/race_detector.engine"
      description: "Dynamic analysis tracking happens-before partial order across concurrent threads (ThreadSanitizer-style)."
    - id: 2
      name: "Wait-For Graph Deadlock Detection"
      location: "src/infra/observability/deadlock/"
      engine: "src/infra/observability/deadlock/wait_for_graph.engine"
      description: "Detects deadlocks by searching for directed cycles in thread-resource allocation graphs."
    - id: 3
      name: "Chandy-Misra-Haas Distributed Deadlock Detection"
      location: "src/infra/observability/deadlock/"
      engine: "src/infra/observability/deadlock/chandy_misra_haas.engine"
      description: "Edge-chasing probe algorithm detecting distributed deadlocks without centralized lock graph materialization."
    - id: 4
      name: "Heap Diffing for Memory Leak Detection"
      location: "src/infra/observability/heap_analysis/"
      engine: "src/infra/observability/heap_analysis/heap_differ.engine"
      description: "Compares sequential heap memory snapshots to isolate monotonically growing object classes."
    - id: 5
      name: "Core Dump / Post-Mortem Memory Analysis"
      location: "src/infra/observability/heap_analysis/"
      engine: "src/infra/observability/heap_analysis/core_dump_inspector.engine"
      description: "Inspects fatal process crash core dumps, stack frames, and unhandled exception pointers."
    - id: 6
      name: "Generational GC Pause Analysis"
      location: "src/infra/observability/heap_analysis/"
      engine: "src/infra/observability/heap_analysis/gc_pause_correlator.engine"
      description: "Correlates Young/Old generational garbage collection stop-the-world pauses with p99 tail latency spikes."
    - id: 7
      name: "Continuous Profiling (Parca/Pyroscope-Style)"
      location: "src/infra/observability/profiling/"
      engine: "src/infra/observability/profiling/continuous_profiler.engine"
      description: "Low-overhead (sub-2%) continuous CPU, memory allocation, and goroutine/thread stack sampling."
    - id: 8
      name: "Flame Graph Differential Analysis"
      location: "src/infra/observability/profiling/"
      engine: "src/infra/observability/profiling/flame_graph_differ.engine"
      description: "Generates baseline vs regression differential flame graphs highlighting hot execution paths."
    - id: 9
      name: "eBPF Kernel-Level Syscall Tracing"
      location: "src/infra/observability/ebpf/"
      engine: "src/infra/observability/ebpf/syscall_tracer.engine"
      description: "Attaches kernel tracepoints and kprobes to monitor TCP socket latency and blocking IO without app changes."
    - id: 10
      name: "Packet Capture / Wire-Level Analysis"
      location: "src/infra/observability/wire_analysis/"
      engine: "src/infra/observability/wire_analysis/packet_capture_analyzer.engine"
      description: "Dissects PCAP ring buffers to detect TCP retransmissions, window resets, and TLS handshake failures."
    - id: 11
      name: "Jepsen-Style Linearizability Testing"
      location: "tests/diagnostics/jepsen/"
      engine: "tests/diagnostics/jepsen/linearizability_verifier"
      description: "Injects network partitions and concurrent operations to formally verify strict linearizability invariants."
    - id: 12
      name: "TLA+ Formal Model Checking"
      location: "tests/diagnostics/tla_plus/"
      engine: "tests/diagnostics/tla_plus/model_checker_runner"
      description: "Formally proves safety, liveness, and invariant consistency across distributed protocol specifications."
    - id: 13
      name: "Byzantine Fault Injection & Diagnosis"
      location: "tests/diagnostics/byzantine/"
      engine: "tests/diagnostics/byzantine/byzantine_injector_verifier"
      description: "Simulates arbitrary/malicious corrupted node responses to verify consensus resilience."
    - id: 14
      name: "Quorum / Version-Vector Inspection"
      location: "src/infra/observability/vector_inspection/"
      engine: "src/infra/observability/vector_inspection/version_vector_inspector.engine"
      description: "Audits vector clocks across cluster nodes to detect concurrent branching and split-brain states."
    - id: 15
      name: "Read-Repair / Anti-Entropy Divergence Audit"
      location: "src/infra/observability/divergence_audit/"
      engine: "src/infra/observability/divergence_audit/anti_entropy_divergence_auditor.engine"
      description: "Audits replica divergence frequencies and repair throughput to identify persistent storage desync."
    - id: 16
      name: "Idempotency Key Audit"
      location: "src/infra/observability/idempotency_audit/"
      engine: "src/infra/observability/idempotency_audit/idempotency_key_auditor.engine"
      description: "Detects duplicate processing and state corruption caused by missed or improperly expired idempotency keys."
    - id: 17
      name: "Git Bisect / Automated Regression Bisection"
      location: "tests/diagnostics/bisection/"
      engine: "tests/diagnostics/bisection/regression_bisector"
      description: "Automates binary search bisection over Git commit history to pinpoint exact performance and invariant regressions."
    - id: 18
      name: "Shadow-Traffic Differential Regression Detection"
      location: "src/infra/observability/shadow_traffic/"
      engine: "src/infra/observability/shadow_traffic/shadow_traffic_comparator.engine"
      description: "Mirrors production traffic to staging versions and compares HTTP responses, schema diffs, and latency."
    - id: 19
      name: "Circuit-Breaker State History Analysis"
      location: "src/infra/observability/circuit_breaker_history/"
      engine: "src/infra/observability/circuit_breaker_history/circuit_breaker_cascade_analyzer.engine"
      description: "Tracks state transition timelines across circuit breakers to diagnose cascading failure cascades."
    - id: 20
      name: "Queueing-Theory (Little’s Law) Saturation Analysis"
      location: "src/infra/observability/saturation_analysis/"
      engine: "src/infra/observability/saturation_analysis/littles_law_saturation_estimator.engine"
      description: "Calculates L = lambda * W queue saturation metrics to pinpoint concurrency bottlenecks before collapse."

  distributed_failure_diagnosis_patterns:
    - id: 1
      name: "Lamport Logical Clocks"
      location: "src/infra/observability/clocks/"
      engine: "src/infra/observability/clocks/lamport_clock.engine"
      description: "Scalar logical timestamps guaranteeing strict event ordering without physical clock synchronization."
    - id: 2
      name: "Vector Clocks"
      location: "src/infra/observability/clocks/"
      engine: "src/infra/observability/clocks/vector_clock.engine"
      description: "Array of logical clocks capturing exact causal (happens-before vs concurrent) relationships across nodes."
    - id: 3
      name: "Hybrid Logical Clocks (HLC)"
      location: "src/infra/observability/clocks/"
      engine: "src/infra/observability/clocks/hlc.engine"
      description: "Combines bounded physical time with logical increments to provide causal, wall-clock monotonic timestamps."
    - id: 4
      name: "W3C Trace Context Propagation"
      location: "src/infra/observability/tracing/"
      engine: "src/infra/observability/tracing/w3c_trace_propagator.engine"
      description: "Injects and extracts standard W3C traceparent and tracestate headers across HTTP, gRPC, and Kafka boundaries."
    - id: 5
      name: "Correlation ID / Causation ID"
      location: "src/infra/observability/tracing/"
      engine: "src/infra/observability/tracing/correlation_causation_tracker.engine"
      description: "Tracks root workflow correlation IDs and direct causal trigger event IDs across asynchronous boundaries."
    - id: 6
      name: "Explicit State Machine + Transition Log"
      location: "src/infra/observability/transition_log/"
      engine: "src/infra/observability/transition_log/transition_logger.engine"
      description: "Immutable, append-only journal recording every state transition, guard evaluation, and triggering event."
    - id: 7
      name: "Chandy-Lamport Snapshot Algorithm"
      location: "src/infra/observability/snapshots/"
      engine: "src/infra/observability/snapshots/chandy_lamport_snapshot.engine"
      description: "Asynchronously captures consistent global state snapshots of distributed channels and processes."
    - id: 8
      name: "Event-Sourced Replay-to-Point"
      location: "src/infra/observability/replay/"
      engine: "src/infra/observability/replay/event_sourced_replay.engine"
      description: "Replays event streams up to a specific timestamp or transaction index to reproduce transient bugs."
    - id: 9
      name: "Distributed Transaction Log Mining (WAL Tailing)"
      location: "database/cdc/"
      engine: "src/infra/observability/wal_miner/wal_log_miner.engine"
      description: "Inspects raw database write-ahead logs to audit historical row modifications and phantom writes."
    - id: 10
      name: "Deterministic Replay from Event Log"
      location: "tests/diagnostics/replay/"
      engine: "src/infra/observability/replay/deterministic_event_replayer.engine"
      description: "Re-executes recorded input streams in sandbox environments to achieve deterministic bug reproduction."
    - id: 11
      name: "Record/Replay at Network Boundary (VCR Proxies)"
      location: "tests/diagnostics/vcr_proxy/"
      harness: "tests/diagnostics/vcr_proxy/boundary_vcr_proxy.harness"
      description: "Records external HTTP/gRPC requests and mocks identical responses during offline diagnostics."
    - id: 12
      name: "Chaos Engineering (Fault Injection)"
      location: "tests/diagnostics/chaos/"
      harness: "tests/diagnostics/chaos/chaos_fault_injector.harness"
      description: "Injects artificial network latency, packet loss, process kills, and disk corruption to validate resilience."
    - id: 13
      name: "Deepest-Leaf-Error Walk"
      location: "src/infra/observability/tracing/"
      engine: "src/infra/observability/tracing/deepest_leaf_error_walker.engine"
      description: "Traverses distributed trace DAGs downward to identify the exact root-cause leaf span that triggered an error."
    - id: 14
      name: "Tail-Based Sampling (100% Retention on Error)"
      location: "src/infra/observability/tracing/"
      engine: "src/infra/observability/tracing/tail_based_sampler.engine"
      description: "Buffers complete traces in memory and enforces 100% storage retention for any trace containing errors or latency outliers."
    - id: 15
      name: "Differential Trace Diff"
      location: "src/infra/observability/tracing/"
      engine: "src/infra/observability/tracing/differential_trace_differ.engine"
      description: "Compares structural span DAGs and duration distributions between fast vs slow execution runs."
    - id: 16
      name: "BubbleUp-Style Distributional Diff"
      location: "src/infra/observability/analytics/"
      engine: "src/infra/observability/analytics/bubbleup_distributional_differ.engine"
      description: "Identifies attribute frequency anomalies across outlier trace populations relative to healthy baselines."
    - id: 17
      name: "Service Dependency Graph + RED Metrics Overlay"
      location: "src/infra/observability/topology/"
      engine: "src/infra/observability/topology/dependency_red_overlay.engine"
      description: "Constructs live service topology graphs annotated with Rate, Errors, and Duration (RED) telemetry."

  core_engine_patterns:
    - name: "Waterfall Hierarchy Aggregator"
      location: "src/features/trace_engine/service/trace_engine_service.py"
      description: "Synthesizes raw parent-child span lists into navigable hierarchical trace waterfall trees with critical paths."
    - name: "Declarative Anti-Corruption Layer (ACL)"
      location: "src/features/trace_engine/schema/trace_engine_schema.py"
      description: "Transforms external OpenTelemetry OTLP JSON / gRPC payloads into clean internal domain trace models."
    - name: "Resilience Decorator Composition"
      location: "src/infra/adapters/decorators.py"
      description: "Unified composition: withTracing(withCircuitBreaker(withCache(withRetry(adapter)))) wrapping trace query ports."

dependencies:
  inbound:
    - "src/api/rest/v1/handlers/trace_engine_handler.py"
    - "src/api/events/trace_span_consumer.py"
  outbound:
    - "src/features/trace_engine/repository/trace_engine_repository_port.py"
    - "src/infra/observability/tracing/w3c_trace_propagator.engine"
  cross_feature: "NONE - interacts via public interfaces, repository ports, and domain events only"

