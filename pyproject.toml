[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-orchestrator"
version = "0.1.0"
description = "Repository Invariant Auditor, Policy Synchronizer, and Safe Refactoring Orchestrator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
policy-orchestrator = "src.api.cli.main:main"
